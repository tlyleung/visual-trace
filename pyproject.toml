[project]
name = "visual-trace"
version = "0.1.0"
description = "Render a Python function's execution as an animated video"
readme = "README.md"
authors = [
    { name = "Timothy Leung", email = "timothyleung@gmail.com" }
]
requires-python = ">=3.12"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
keywords = ["animation", "manim", "visualization", "tracing", "education", "algorithms"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Education",
    "Topic :: Multimedia :: Video",
    "Topic :: Software Development :: Debuggers",
]
dependencies = [
    "manim>=0.19.0",
]

[project.scripts]
visual-trace = "visual_trace.cli:main"

[build-system]
requires = ["uv_build>=0.9.7,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
