name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    name: tests (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      # manimpango has no wheel for these runners and builds from source,
      # which needs pangocairo via pkg-config.
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libcairo2-dev libpango1.0-dev
      - run: uv sync --locked
      - run: uv run pytest tests/ -q

  render:
    name: render + probe
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      # As above, plus the binaries verify.py shells out to: ffmpeg for frame
      # extraction, and ImageMagick for convert/montage/compare. The font is
      # not optional -- --no-install-recommends leaves ImageMagick with none,
      # and captioning the contact sheet then fails on `unable to read font`.
      - name: Install build and render dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libcairo2-dev libpango1.0-dev ffmpeg imagemagick \
            fonts-dejavu-core
      - run: uv sync --locked
      # verify.py exits non-zero if any probe invariant or the drift check
      # fails, so this gates on the render itself, not just on it completing.
      - name: Verify an example end to end
        run: uv run scripts/verify.py examples/two_sum.py

  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv build
